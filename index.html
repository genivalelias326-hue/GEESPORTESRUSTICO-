
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#155eef">
<link rel="manifest" href="./manifest.json">
<title>GEESPORTESRUSTICO</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fc;
  color:#1f2937;
}

header{
  background:#155eef;
  color:white;
  padding:22px 16px;
  text-align:center;
}

header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;font-size:13px}

.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

.search-box{margin-bottom:20px}

.search-box input,
.admin input,
.admin select{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.category{
  background:white;
  border:none;
  padding:16px 8px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  cursor:pointer;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
  margin-top:15px;
}

.product{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#ddd;
}

.product-info{padding:12px}

.product h3{
  margin:0 0 10px;
  font-size:16px;
}

.offer{
  background:#ffeded;
  color:#dc2626;
  padding:10px;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  text-align:center;
  margin:10px 0;
}

.platform{
  color:#666;
  font-size:12px;
  margin-bottom:12px;
}

.buy-button{
  display:block;
  width:100%;
  border:none;
  background:#16a34a;
  color:white;
  padding:15px 10px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
}

.buy-button:active{background:#15803d}

.admin{
  background:white;
  margin-top:35px;
  padding:20px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.admin h2{margin-top:0}

.add-button{
  display:block;
  width:100%;
  border:none;
  background:#155eef;
  color:white;
  padding:15px;
  border-radius:10px;
  font-weight:bold;
  font-size:15px;
  margin-top:10px;
  cursor:pointer;
}

.cancel-button{
  display:none;
  width:100%;
  border:none;
  background:#777;
  color:white;
  padding:13px;
  border-radius:10px;
  margin-top:8px;
  cursor:pointer;
}

.manage-buttons{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.edit-button,.delete-button{
  flex:1;
  border:none;
  padding:11px 5px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.edit-button{
  background:#e0edff;
  color:#155eef;
}

.delete-button{
  background:#fee2e2;
  color:#dc2626;
}

.preview-box{
  display:none;
  margin-top:10px;
  text-align:center;
}

.preview-box img{
  max-width:100%;
  max-height:250px;
  border-radius:12px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

footer{
  text-align:center;
  padding:30px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<header>
<h1>🛒 GEESPORTESRUSTICO</h1>
<p>Ofertas e produtos selecionados para você</p>
</header>

<div class="container">

<div class="search-box">
<input
type="text"
id="searchInput"
placeholder="🔎 Pesquisar produtos..."
oninput="searchProducts()">
</div>

<h2>📂 Categorias</h2>

<div class="categories">
<button class="category" onclick="filterCategory('Cozinha')">🍳 Cozinha</button>
<button class="category" onclick="filterCategory('Banheiro')">🚿 Artigos Banheiro</button>
<button class="category" onclick="filterCategory('Brinquedos')">🧸 Brinquedos</button>
<button class="category" onclick="filterCategory('Carro')">🚗 Acessórios de Carro</button>
<button class="category" onclick="filterCategory('Roupa de Time')">⚽ Roupa de Time</button>
<button class="category" onclick="filterCategory('Celular')">📱 Celular</button>
<button class="category" onclick="filterCategory('Fones')">🎧 Fones de Ouvido</button>
<button class="category" onclick="filterCategory('Pet')">🐶 Pet</button>
<button class="category" onclick="filterCategory('Moda')">👕 Moda</button>
<button class="category" onclick="filterCategory('Tênis')">👟 Tênis</button>
<button class="category" onclick="showAllProducts()">🏠 Todos</button>
</div>

<h2 id="productsTitle">🔥 Produtos e Ofertas</h2>

<div class="products" id="products"></div>

<div class="admin" id="adminPanel">

<h2 id="formTitle">➕ Cadastrar Produto</h2>

<input
type="text"
id="productName"
placeholder="Nome do produto">

<label><strong>📸 Escolher foto do produto:</strong></label>

<input
type="file"
id="productImage"
accept="image/*"
onchange="previewImage()">

<div class="preview-box" id="previewBox">
<p>👀 Prévia da foto:</p>
<img id="preview">
</div>

<select id="productCategory">
<option value="">Escolha a categoria</option>
<option>Cozinha</option>
<option>Banheiro</option>
<option>Brinquedos</option>
<option>Carro</option>
<option>Roupa de Time</option>
<option>Celular</option>
<option>Fones</option>
<option>Pet</option>
<option>Moda</option>
<option>Tênis</option>
</select>

<select id="productPlatform">
<option value="">Escolha a plataforma</option>
<option>Shopee</option>
<option>Mercado Livre</option>
</select>

<input
type="url"
id="productLink"
placeholder="🔗 Cole aqui seu link de afiliado">

<button class="add-button" id="submitButton" onclick="addProduct()">
🚀 PUBLICAR PRODUTO
</button>

<button class="cancel-button" id="cancelButton" onclick="cancelEdit()">
CANCELAR EDIÇÃO
</button>

</div>
</div>

<footer>
© 2026 GEESPORTESRUSTICO • Ofertas selecionadas
</footer>

<script>

let products = JSON.parse(localStorage.getItem("geProdutos")) || [];
let selectedImage = "";
let editingId = null;

// Identifica os produtos antigos sem apagar seus dados
products = products.map((product,index)=>({
  ...product,
  id:product.id || (Date.now()+index)
}));

function saveProducts(){
  localStorage.setItem("geProdutos",JSON.stringify(products));
}

function previewImage(){

  const file=document.getElementById("productImage").files[0];

  if(!file)return;

  if(!file.type.startsWith("image/")){
    alert("Escolha uma imagem válida.");
    return;
  }

  const reader=new FileReader();

  reader.onload=function(event){
    selectedImage=event.target.result;
    document.getElementById("preview").src=selectedImage;
    document.getElementById("previewBox").style.display="block";
  };

  reader.readAsDataURL(file);
}

function renderProducts(list=products){

  const container=document.getElementById("products");
  container.innerHTML="";

  if(list.length===0){
    container.innerHTML=`
      <div class="empty">
        Nenhum produto encontrado.<br>
        Cadastre seu primeiro produto! 🛒
      </div>`;
    return;
  }

  list.forEach(product=>{

    const card=document.createElement("div");
    card.className="product";

    const img=document.createElement("img");
    img.src=product.image;
    img.alt=product.name;
    img.loading="lazy";

    const info=document.createElement("div");
    info.className="product-info";

    const name=document.createElement("h3");
    name.textContent=product.name;

    const offer=document.createElement("div");
    offer.className="offer";
    offer.textContent="🔥 PREÇO BAIXOU!";

    const platform=document.createElement("div");
    platform.className="platform";
    platform.textContent="🛍️ "+product.platform;

    const link=document.createElement("a");
    link.className="buy-button";
    link.href=product.link;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent="🛒 COMPRE AGORA";

    const controls=document.createElement("div");
    controls.className="manage-buttons";

    const edit=document.createElement("button");
    edit.className="edit-button";
    edit.textContent="✏️ EDITAR";
    edit.onclick=()=>editProduct(product.id);

    const remove=document.createElement("button");
    remove.className="delete-button";
    remove.textContent="🗑️ EXCLUIR";
    remove.onclick=()=>deleteProduct(product.id);

    controls.append(edit,remove);

    info.append(name,offer,platform,link,controls);
    card.append(img,info);
    container.appendChild(card);

  });
}

function addProduct(){

  const name=document.getElementById("productName").value.trim();
  const category=document.getElementById("productCategory").value;
  const platform=document.getElementById("productPlatform").value;
  const link=document.getElementById("productLink").value.trim();

  if(!name || (!selectedImage && editingId===null) ||
     !category || !platform || !link){

    alert("⚠️ Preencha todos os campos e escolha uma foto!");
    return;
  }

  try{
    const url=new URL(link);

    if(!["http:","https:"].includes(url.protocol)){
      throw new Error();
    }
  }catch{
    alert("⚠️ Insira um link válido.");
    return;
  }

  if(editingId!==null){

    const index=products.findIndex(p=>p.id===editingId);

    if(index===-1){
      alert("Produto não encontrado.");
      cancelEdit();
      return;
    }

    products[index]={
      ...products[index],
      name,
      category,
      platform,
      link,
      image:selectedImage || products[index].image
    };

    alert("✅ Anúncio atualizado com sucesso!");

  }else{

    products.push({
      id:Date.now(),
      name,
      category,
      platform,
      link,
      image:selectedImage
    });

    alert("✅ Produto publicado com sucesso!");
  }

  saveProducts();
  renderProducts();
  resetForm();
}

function editProduct(id){

  const product=products.find(p=>p.id===id);

  if(!product)return;

  editingId=id;

  document.getElementById("productName").value=product.name;
  document.getElementById("productCategory").value=product.category;
  document.getElementById("productPlatform").value=product.platform;
  document.getElementById("productLink").value=product.link;

  selectedImage="";

  document.getElementById("preview").src=product.image;
  document.getElementById("previewBox").style.display="block";

  document.getElementById("formTitle").innerText="✏️ Editar Anúncio";
  document.getElementById("submitButton").innerText="💾 SALVAR ALTERAÇÕES";
  document.getElementById("cancelButton").style.display="block";

  document.getElementById("adminPanel").scrollIntoView({
    behavior:"smooth"
  });
}

function deleteProduct(id){

  const product=products.find(p=>p.id===id);

  if(!product)return;

  const confirmDelete=confirm(
    "Tem certeza que deseja excluir o anúncio: "+product.name+"?"
  );

  if(!confirmDelete)return;

  products=products.filter(p=>p.id!==id);

  saveProducts();
  renderProducts();

  if(editingId===id)resetForm();

  alert("🗑️ Anúncio excluído!");
}

function resetForm(){

  editingId=null;
  selectedImage="";

  document.getElementById("productName").value="";
  document.getElementById("productImage").value="";
  document.getElementById("productCategory").value="";
  document.getElementById("productPlatform").value="";
  document.getElementById("productLink").value="";

  document.getElementById("previewBox").style.display="none";

  document.getElementById("formTitle").innerText="➕ Cadastrar Produto";
  document.getElementById("submitButton").innerText="🚀 PUBLICAR PRODUTO";
  document.getElementById("cancelButton").style.display="none";
}

function cancelEdit(){
  resetForm();
}

function filterCategory(category){

  const filtered=products.filter(
    product=>product.category===category
  );

  document.getElementById("productsTitle").innerText="📂 "+category;
  renderProducts(filtered);
}

function showAllProducts(){

  document.getElementById("searchInput").value="";
  document.getElementById("productsTitle").innerText="🔥 Produtos e Ofertas";

  renderProducts();
}

function searchProducts(){

  const search=document
    .getElementById("searchInput")
    .value.toLowerCase();

  const filtered=products.filter(product=>
    product.name.toLowerCase().includes(search)
  );

  document.getElementById("productsTitle").innerText=
    search?"🔎 Resultado da pesquisa":"🔥 Produtos e Ofertas";

  renderProducts(filtered);
}

saveProducts();
renderProducts();

</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./service-worker.js")
    .then(function(registration){
      console.log("Service Worker registrado:",registration.scope);
    })
    .catch(function(error){
      console.log("Erro ao registrar Service Worker:",error);
    });
  });
}
</script>

</body>
</html>
