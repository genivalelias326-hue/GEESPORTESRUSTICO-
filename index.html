<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#155eef">

<link rel="manifest" href="./manifest.json">

<title>GEESPORTESRUSTICO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f7fc;
  color: #1f2937;
}

header {
  background: #155eef;
  color: white;
  padding: 22px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 16px;
}

.search-box input,
.admin input,
.admin select {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 15px;
}

.search-box {
  margin-bottom: 20px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.category {
  background: white;
  border: none;
  padding: 16px 8px;
  border-radius: 12px;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  cursor: pointer;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  margin-top: 15px;
}

.product {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.10);
}

.product img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #ddd;
}

.product-info {
  padding: 12px;
}

.product h3 {
  margin: 0 0 8px;
  font-size: 15px;
}

.price {
  color: #155eef;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.platform {
  color: #666;
  font-size: 12px;
  margin-bottom: 10px;
}

.buy-button,
.add-button {
  display: block;
  width: 100%;
  border: none;
  background: #16a34a;
  color: white;
  padding: 13px;
  border-radius: 10px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.admin {
  background: white;
  margin-top: 35px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}
