
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#155eef">
<link rel="manifest" href="./manifest.json">
<title>GEESPORTESRUSTICO</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#1f2937}
header{background:#155eef;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;font-size:13px}
.container{max-width:1000px;margin:auto;padding:16px}
.search-box{margin-bottom:20px}
.search-box input,.admin input,.admin select{width:100%;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:15px}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.category{background:white;border:none;padding:16px 8px;border-radius:12px;font-weight:bold;box-shadow:0 3px 10px #0001;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:15px}
.product{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #0002}
.product img{width:100%;height:180px;object-fit:cover;background:#ddd}
.product-info{padding:12px}
.product h3{margin:0 0 8px;font-size:15px}
.price{color:#155eef;font-size:18px;font-weight:bold;margin-bottom:8px}
.platform{color:#666;font-size:12px;margin-bottom:10px}
.offer{display:inline-block;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:bold;margin:5px 0 10px}
.price-down{background:#fee2e2;color:#dc2626}
.super-offer{background:#fef3c7;color:#b45309}
.normal-offer{background:#e0f2fe;color:#0369a1}
.buy-button,.add-button{display:block;width:100%;border:none;background:#16a34a;color:white;padding:13px;border-radius:10px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.admin{background:white;margin-top:35px;padding:20px;border-radius:16px;box-shadow:0 3px 12px #0001}
.admin h2{margin-top:0}
.add-button{background:#155eef;margin-top:10px}
.preview-box{display:none;margin-top:10px;text-align:center}
.preview-box img{max-width:100%;max-height:250px;border-radius:12px}
.empty{text-align:center;padding:30px;color:#777}
footer{text-align:center;padding:30px;font-size:13px;color:#777}
.small{font-size:12px;color:#777}
</style>
</head>

<body>

<header>
<h1>🛒 GEESPORTESRUSTICO</h1>
<p>Ofertas e produtos selecionados para você</p>
</header>

<div class="container">

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔎 Pesquisar produtos..." oninput="searchProducts()">
</div>

<h2>📂 Categorias</h2>

<div class="categories">
<button class="category" onclick="filterCategory('Cozinha')">🍳 Cozinha</button>
<button class="category" onclick="filterCategory('Banheiro')">🚿 Artigos Banheiro</button>
<button class="category" onclick="filterCategory('Brinquedos')">🧸 Brinquedos</button>
<button class="category" onclick="filterCategory('Carro')">🚗 Acessórios de Carro</button>
<button class="category" onclick="filterCategory('Roupa de Time')">⚽ Roupa de Time</button>
<button class="category" onclick="filterCategory('Celular')">📱 Celular</button>
<button class="category" onclick="filterCategory('Fones')">🎧 Fones de Ouvido</button>
<button class="category" onclick="filterCategory('Pet')">🐶 Pet</button>
<button class="category" onclick="filterCategory('Moda')">👕 Moda</button>
<button class="category" onclick="filterCategory('Tênis')">👟 Tênis</button>
</div>

<h2 id="productsTitle">🔥 Produtos e Ofertas</h2>
<div class="products" id="products"></div>

<div class="admin">
<h2>➕ Cadastrar Produto</h2>

<input type="text" id="productName" placeholder="Nome do produto">

<label><strong>Preço atual (R$):</strong></label>
<input type="number" id="productPrice" placeholder="Ex: 89.90" min="0" step="0.01">

<label><strong>Preço anterior (R$):</strong></label>
<input type="number" id="previousPrice" placeholder="Ex: 119.90 (opcional)" min="0" step="0.01">

<p class="small">O sistema compara os dois valores para identificar uma queda real.</p>

<label><strong>📸 Escolher foto do produto:</strong></label>
<input type="file" id="productImage" accept="image/*" onchange="previewImage()">

<div class="preview-box" id="previewBox">
<p>👀 Prévia da foto:</p>
<img id="preview">
</div>

<select id="productCategory">
<option value="">Escolha a categoria</option>
<option>Cozinha</option><option>Banheiro</option>
<option>Brinquedos</option><option>Carro</option>
<option>Roupa de Time</option><option>Celular</option>
<option>Fones</option><option>Pet</option>
<option>Moda</option><option>Tênis</option>
</select>

<select id="productPlatform">
<option value="">Escolha a plataforma</option>
<option>Shopee</option>
<option>Mercado Livre</option>
</select>

<input type="url" id="productLink" placeholder="🔗 Cole aqui seu link de afiliado">

<button class="add-button" onclick="addProduct()">🚀 PUBLICAR PRODUTO</button>
</div>
</div>

<footer>
© 2026 GEESPORTESRUSTICO • Ofertas selecionadas
</footer>

<script>
let products = JSON.parse(localStorage.getItem("geProdutos")) || [];
let selectedImage = "";

function saveProducts(){
localStorage.setItem("geProdutos",JSON.stringify(products));
}

function previewImage(){
const file=document.getElementById("productImage").files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(event){
selectedImage=event.target.result;
document.getElementById("preview").src=selectedImage;
document.getElementById("previewBox").style.display="block";
};
reader.readAsDataURL(file);
}

function getOffer(product){
const current=Number(product.price);
const previous=Number(product.previousPrice);

if(previous>0 && current>0 && current<previous){
return '<div class="offer price-down">🔥 PREÇO BAIXOU!</div>';
}
if(product.promotion===true){
return '<div class="offer super-offer">💥 OFERTA IMPERDÍVEL!</div>';
}
return '<div class="offer normal-offer">🛍️ CONFIRA A OFERTA</div>';
}

function renderProducts(list=products){
const container=document.getElementById("products");
container.innerHTML="";

if(list.length===0){
container.innerHTML='<div class="empty">Nenhum produto encontrado.<br>Cadastre seu primeiro produto! 🛒</div>';
return;
}

list.forEach(product=>{
const price=Number(product.price);
const previous=Number(product.previousPrice);
const priceText=price>0?price.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):(product.price||"Consulte o preço");

const oldPrice=previous>price && price>0
? '<div class="small"><s>'+previous.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})+'</s></div>'
: "";

const card=document.createElement("div");
card.className="product";

const img=document.createElement("img");
img.src=product.image;
img.alt=product.name;

const info=document.createElement("div");
info.className="product-info";

const name=document.createElement("h3");
name.textContent=product.name;

const offer=document.createElement("div");
offer.innerHTML=getOffer(product);

const priceDiv=document.createElement("div");
priceDiv.className="price";
priceDiv.textContent=priceText;

const old=document.createElement("div");
old.innerHTML=oldPrice;

const platform=document.createElement("div");
platform.className="platform";
platform.textContent="🛍️ "+product.platform;

const link=document.createElement("a");
link.className="buy-button";
link.href=product.link;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="🛒 COMPRAR AGORA";

info.append(name,offer,old,priceDiv,platform,link);
card.append(img,info);
container.appendChild(card);
});
}

function addProduct(){
const name=document.getElementById("productName").value.trim();
const price=document.getElementById("productPrice").value;
const previous=document.getElementById("previousPrice").value;
const category=document.getElementById("productCategory").value;
const platform=document.getElementById("productPlatform").value;
const link=document.getElementById("productLink").value.trim();

if(!name||!price||Number(price)<=0||!selectedImage||!category||!platform||!link){
alert("⚠️ Preencha todos os campos obrigatórios e escolha uma foto!");
return;
}

try{
const url=new URL(link);
if(!["https:","http:"].includes(url.protocol)){
alert("Informe um link válido.");
return;
}
}catch(e){
alert("Informe um link válido.");
return;
}

const current=Number(price);
const old=Number(previous);

if(previous && (old<=0 || old<=current)){
alert("O preço anterior deve ser maior que o preço atual para indicar uma queda.");
return;
}

products.push({
name,
price:current,
previousPrice:previous?old:0,
image:selectedImage,
category,
platform,
link,
promotion:false
});

saveProducts();
renderProducts();

["productName","productPrice","previousPrice","productImage","productCategory","productPlatform","productLink"].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("previewBox").style.display="none";
selectedImage="";
alert("✅ Produto publicado com sucesso!");
}

function filterCategory(category){
const filtered=products.filter(product=>product.category===category);
document.getElementById("productsTitle").innerText="📂 "+category;
renderProducts(filtered);
}

function searchProducts(){
const search=document.getElementById("searchInput").value.toLowerCase();
const filtered=products.filter(product=>product.name.toLowerCase().includes(search));
document.getElementById("productsTitle").innerText=search?"🔎 Resultado da pesquisa":"🔥 Produtos e Ofertas";
renderProducts(filtered);
}

renderProducts();
</script>

<script>
if("serviceWorker" in navigator){
window.addEventListener("load",function(){
navigator.serviceWorker.register("./service-worker.js")
.then(function(registration){
console.log("Service Worker registrado:",registration.scope);
})
.catch(function(error){
console.log("Erro ao registrar Service Worker:",error);
});
});
}
</script>

</body>
</html>
