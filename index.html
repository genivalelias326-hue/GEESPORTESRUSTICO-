
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#155eef">
<link rel="manifest" href="./manifest.json">
<title>GEESPORTESRUSTICO</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fc;color:#1f2937}
header{background:#155eef;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;font-size:13px}
.container{max-width:1000px;margin:auto;padding:16px}
.search-box{margin-bottom:20px}
.search-box input,.admin input,.admin select,.login-box input{
width:100%;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:15px
}
.categories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.category{background:white;border:none;padding:16px 8px;border-radius:12px;font-weight:bold;box-shadow:0 3px 10px rgba(0,0,0,.08);cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:15px}
.product{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.10)}
.gallery{position:relative;width:100%;height:210px;background:#eee;overflow:hidden;touch-action:pan-y}
.gallery img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:40px;border:none;border-radius:20px;background:rgba(0,0,0,.55);color:white;font-size:23px;cursor:pointer;z-index:2}
.gallery-prev{left:5px}.gallery-next{right:5px}
.gallery-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.gallery-dot{width:9px;height:9px;padding:0;border:none;border-radius:50%;background:rgba(255,255,255,.7);cursor:pointer}
.gallery-dot.active{background:#155eef;transform:scale(1.3)}
.gallery-counter{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:white;font-size:12px;padding:5px 9px;border-radius:15px}
.image-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;align-items:center;justify-content:center;padding:15px}
.image-modal img{max-width:100%;max-height:85vh;object-fit:contain}
.modal-close{position:absolute;top:15px;right:20px;background:none;border:none;color:white;font-size:36px;cursor:pointer}
.product-info{padding:12px}
.product h3{margin:0 0 10px;font-size:16px}
.offer{background:#ffeded;color:#dc2626;padding:10px;border-radius:8px;font-size:15px;font-weight:bold;text-align:center;margin:10px 0}
.platform{color:#666;font-size:12px;margin-bottom:12px}
.buy-button{display:block;width:100%;border:none;background:#16a34a;color:white;padding:15px 10px;border-radius:10px;font-size:16px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.buy-button:active{background:#15803d}
.admin,.login-box{background:white;margin-top:25px;padding:20px;border-radius:16px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.admin h2,.login-box h2{margin-top:0}
.add-button,.login-button,.logout-button,.share-button{display:block;width:100%;border:none;background:#155eef;color:white;padding:15px;border-radius:10px;font-weight:bold;font-size:15px;margin-top:10px;cursor:pointer}
.add-button:disabled{opacity:.6;cursor:wait}
.cancel-button{display:none;width:100%;border:none;background:#777;color:white;padding:13px;border-radius:10px;margin-top:8px;cursor:pointer}
.manage-buttons{display:flex;gap:7px;margin-top:10px}
.edit-button,.delete-button{flex:1;border:none;padding:11px 5px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer}
.edit-button{background:#e0edff;color:#155eef}
.delete-button{background:#fee2e2;color:#dc2626}
.preview-box{display:none;margin-top:12px}
.preview-list{display:flex;gap:10px;overflow-x:auto;padding:10px 4px}
.preview-item{position:relative;flex:0 0 85px}
.preview-item img{width:85px;height:85px;object-fit:cover;border-radius:9px;border:2px solid #ddd}
.remove-photo{position:absolute;top:-7px;right:-5px;border:none;background:#dc2626;color:white;width:23px;height:23px;border-radius:50%;cursor:pointer}
.photo-count{font-size:13px;color:#666}
.empty{text-align:center;padding:30px;color:#777}
footer{text-align:center;padding:30px;font-size:13px;color:#777}
.hidden{display:none!important}
.status{font-size:13px;margin-top:10px;color:#555}
@media(max-width:380px){
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gallery{height:175px}
.product h3{font-size:14px}
.buy-button{font-size:14px}
}
</style>
</head>

<body>
<header>
<h1>🛒 GEESPORTESRUSTICO</h1>
<p>Ofertas e produtos selecionados para você</p>
</header>

<div class="container">

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔎 Pesquisar produtos..." oninput="searchProducts()">
</div>

<h2>📂 Categorias</h2>
<div class="categories">
<button class="category" onclick="filterCategory('Cozinha')">🍳 Cozinha</button>
<button class="category" onclick="filterCategory('Banheiro')">🚿 Artigos Banheiro</button>
<button class="category" onclick="filterCategory('Brinquedos')">🧸 Brinquedos</button>
<button class="category" onclick="filterCategory('Carro')">🚗 Acessórios de Carro</button>
<button class="category" onclick="filterCategory('Roupa de Time')">⚽ Roupa de Time</button>
<button class="category" onclick="filterCategory('Celular')">📱 Celular</button>
<button class="category" onclick="filterCategory('Fones')">🎧 Fones de Ouvido</button>
<button class="category" onclick="filterCategory('Pet')">🐶 Pet</button>
<button class="category" onclick="filterCategory('Moda')">👕 Moda</button>
<button class="category" onclick="filterCategory('Tênis')">👟 Tênis</button>
<button class="category" onclick="showAllProducts()">🏠 Todos</button>
</div>

<h2 id="productsTitle">🔥 Produtos e Ofertas</h2>
<div class="products" id="products"></div>

<button class="login-button" id="openLoginButton" onclick="showLogin()">🔐 ENTRAR COMO ADMINISTRADOR</button>

<div class="login-box hidden" id="loginPanel">
<h2>🔐 Acesso do administrador</h2>
<input type="email" id="loginEmail" placeholder="E-mail do administrador" autocomplete="username">
<input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">
<button class="login-button" onclick="loginAdmin()">ENTRAR</button>
<button class="logout-button" style="background:#777" onclick="hideLogin()">CANCELAR</button>
<p class="status" id="loginStatus"></p>
</div>

<div class="admin hidden" id="adminPanel">
<h2 id="formTitle">➕ Cadastrar Produto</h2>

<input type="text" id="productName" placeholder="Nome do produto">

<label><strong>📸 Escolha as fotos do produto:</strong></label>
<input type="file" id="productImage" accept="image/*" multiple onchange="previewImage()">
<p class="photo-count">Selecione várias fotos de uma vez.</p>

<div class="preview-box" id="previewBox">
<strong>👀 Fotos selecionadas:</strong>
<div class="preview-list" id="previewList"></div>
</div>

<select id="productCategory">
<option value="">Escolha a categoria</option>
<option>Cozinha</option><option>Banheiro</option><option>Brinquedos</option>
<option>Carro</option><option>Roupa de Time</option><option>Celular</option>
<option>Fones</option><option>Pet</option><option>Moda</option><option>Tênis</option>
</select>

<select id="productPlatform">
<option value="">Escolha a plataforma</option>
<option>Shopee</option><option>Mercado Livre</option>
</select>

<input type="url" id="productLink" placeholder="🔗 Cole aqui seu link de afiliado">

<button class="add-button" id="submitButton" onclick="addProduct()">🚀 PUBLICAR PRODUTO</button>
<button class="cancel-button" id="cancelButton" onclick="cancelEdit()">CANCELAR EDIÇÃO</button>
<p class="status" id="adminStatus"></p>
<button class="logout-button" onclick="logoutAdmin()">SAIR DA ÁREA ADMINISTRATIVA</button>
</div>

<button class="share-button" onclick="shareStore()">📲 COMPARTILHAR LOJA</button>
</div>

<div class="image-modal" id="imageModal" onclick="closeImageModal()">
<button class="modal-close" onclick="closeImageModal()">×</button>
<img id="modalImage" src="" alt="Foto ampliada do produto">
</div>

<footer>© 2026 GEESPORTESRUSTICO • Ofertas selecionadas</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://eefhhutbowjwnxfsecjd.supabase.co";
const SUPABASE_KEY = "sb_publishable_SdRT7jPMqT_ZgQvVNcyazg_vKFjKY_a";
const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[];
let selectedImages=[];
let editingId=null;
let isAdmin=false;
let readingImages=false;

function setStatus(id,message){
 document.getElementById(id).textContent=message||"";
}

function showLogin(){
 document.getElementById("loginPanel").classList.remove("hidden");
 document.getElementById("openLoginButton").classList.add("hidden");
}
function hideLogin(){
 document.getElementById("loginPanel").classList.add("hidden");
 document.getElementById("openLoginButton").classList.remove("hidden");
}
function updateAdminView(){
 document.getElementById("adminPanel").classList.toggle("hidden",!isAdmin);
 document.getElementById("openLoginButton").classList.toggle("hidden",isAdmin);
 document.getElementById("loginPanel").classList.add("hidden");
 renderProducts();
}

async function loginAdmin(){
 const email=document.getElementById("loginEmail").value.trim();
 const password=document.getElementById("loginPassword").value;
 if(!email||!password){setStatus("loginStatus","Informe seu e-mail e sua senha.");return;}
 setStatus("loginStatus","Verificando acesso...");
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){setStatus("loginStatus","Não foi possível entrar: "+error.message);return;}
 isAdmin=true;
 updateAdminView();
 setStatus("adminStatus","Você entrou na área administrativa.");
}

async function logoutAdmin(){
 await supabaseClient.auth.signOut();
 isAdmin=false;
 resetForm();
 updateAdminView();
}

async function checkSession(){
 const {data,error}=await supabaseClient.auth.getSession();
 if(!error && data.session){isAdmin=true;}
 updateAdminView();
}
supabaseClient.auth.onAuthStateChange((_event,session)=>{
 isAdmin=!!session;
 updateAdminView();
});

async function loadProducts(){
 const container=document.getElementById("products");
 container.innerHTML='<div class="empty">⏳ Carregando produtos...</div>';
 const {data,error}=await supabaseClient.from("products")
 .select("id,name,category,platform,link,images")
 .order("created_at",{ascending:false});
 if(error){
  container.innerHTML='<div class="empty">Não foi possível carregar os produtos. Verifique a conexão e as permissões do Supabase.</div>';
  console.error(error);
  return;
 }
 products=(data||[]).map(p=>({...p,images:Array.isArray(p.images)?p.images:[]}));
 renderProducts();
}

async function previewImage(){
 const input=document.getElementById("productImage");
 const files=Array.from(input.files||[]);
 if(!files.length)return;
 input.value="";
 readingImages=true;
 const button=document.getElementById("submitButton");
 button.disabled=true;
 button.textContent="⏳ CARREGANDO FOTOS...";
 for(const file of files){
  if(!file.type.startsWith("image/"))continue;
  selectedImages.push({file,url:URL.createObjectURL(file)});
 }
 renderPreview();
 readingImages=false;
 button.disabled=false;
 button.textContent=editingId!==null?"💾 SALVAR ALTERAÇÕES":"🚀 PUBLICAR PRODUTO";
}

function renderPreview(){
 const box=document.getElementById("previewBox");
 const list=document.getElementById("previewList");
 list.innerHTML="";
 if(!selectedImages.length){box.style.display="none";return;}
 box.style.display="block";
 selectedImages.forEach((item,index)=>{
  const div=document.createElement("div");
  div.className="preview-item";
  const img=document.createElement("img");
  img.src=item.url;
  const remove=document.createElement("button");
  remove.className="remove-photo";
  remove.textContent="×";
  remove.onclick=()=>{selectedImages.splice(index,1);renderPreview();};
  div.append(img,remove);
  list.appendChild(div);
 });
 const count=document.createElement("p");
 count.className="photo-count";
 count.textContent=selectedImages.length+" foto(s) selecionada(s)";
 list.appendChild(count);
}

async function uploadImages(){
 const urls=[];
 for(const item of selectedImages){
  if(item.file){
   const extension=(item.file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
   const path="produtos/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+extension;
   const {error}=await supabaseClient.storage.from("product-images").upload(path,item.file,{cacheControl:"3600",upsert:false});
   if(error)throw error;
   const {data}=supabaseClient.storage.from("product-images").getPublicUrl(path);
   urls.push(data.publicUrl);
  }else if(item.url){
   urls.push(item.url);
  }
 }
 return urls;
}

async function addProduct(){
 if(!isAdmin){alert("Entre como administrador para publicar.");return;}
 if(readingImages){alert("Aguarde o carregamento das fotos.");return;}
 const name=document.getElementById("productName").value.trim();
 const category=document.getElementById("productCategory").value;
 const platform=document.getElementById("productPlatform").value;
 const link=document.getElementById("productLink").value.trim();
 if(!name||!selectedImages.length||!category||!platform||!link){
  alert("Preencha todos os campos e escolha pelo menos uma foto.");return;
 }
 try{const url=new URL(link);if(!["http:","https:"].includes(url.protocol))throw new Error();}
 catch{alert("Insira um link válido.");return;}

 const button=document.getElementById("submitButton");
 button.disabled=true;
 button.textContent="⏳ SALVANDO PRODUTO...";
 setStatus("adminStatus","Enviando fotos e salvando produto...");
 try{
  const imageUrls=await uploadImages();
  const record={name,category,platform,link,images:imageUrls};
  let result;
  if(editingId!==null){
   result=await supabaseClient.from("products").update(record).eq("id",editingId).select();
  }else{
   result=await supabaseClient.from("products").insert(record).select();
  }
  if(result.error)throw result.error;
  await loadProducts();
  resetForm();
  setStatus("adminStatus","✅ Produto salvo na loja!");
 }catch(error){
  console.error(error);
  setStatus("adminStatus","Erro ao salvar: "+(error.message||"Verifique as permissões do Supabase e do bucket."));
  alert("Não foi possível salvar o produto.\n\n"+(error.message||"Verifique as permissões do Supabase."));
 }finally{
  button.disabled=false;
  button.textContent=editingId!==null?"💾 SALVAR ALTERAÇÕES":"🚀 PUBLICAR PRODUTO";
 }
}

function createGallery(product){
 const images=product.images||[];
 const gallery=document.createElement("div");
 gallery.className="gallery";
 if(!images.length)return gallery;
 let currentIndex=0;
 const img=document.createElement("img");
 img.src=images[0];img.alt=product.name;img.loading="lazy";
 img.onclick=()=>openImageModal(images[currentIndex]);
 gallery.appendChild(img);
 if(images.length===1)return gallery;
 const counter=document.createElement("div");counter.className="gallery-counter";
 const dots=document.createElement("div");dots.className="gallery-dots";
 function showSlide(index){
  currentIndex=(index+images.length)%images.length;
  img.src=images[currentIndex];
  counter.textContent=(currentIndex+1)+" / "+images.length;
  Array.from(dots.children).forEach((dot,i)=>dot.classList.toggle("active",i===currentIndex));
 }
 const prev=document.createElement("button");
 prev.className="gallery-arrow gallery-prev";prev.textContent="‹";
 prev.onclick=()=>showSlide(currentIndex-1);
 const next=document.createElement("button");
 next.className="gallery-arrow gallery-next";next.textContent="›";
 next.onclick=()=>showSlide(currentIndex+1);
 images.forEach((image,index)=>{
  const dot=document.createElement("button");
  dot.className="gallery-dot";
  dot.onclick=()=>showSlide(index);
  dots.appendChild(dot);
 });
 let touchStart=0;
 gallery.addEventListener("touchstart",e=>{touchStart=e.changedTouches[0].screenX;},{passive:true});
 gallery.addEventListener("touchend",e=>{
  const difference=touchStart-e.changedTouches[0].screenX;
  if(Math.abs(difference)>40)showSlide(currentIndex+(difference>0?1:-1));
 },{passive:true});
 gallery.append(prev,next,counter,dots);
 showSlide(0);
 return gallery;
}

function renderProducts(list=products){
 const container=document.getElementById("products");
 container.innerHTML="";
 if(!list.length){
  container.innerHTML='<div class="empty">Nenhum produto encontrado.</div>';
  return;
 }
 list.forEach(product=>{
  const card=document.createElement("div");card.className="product";
  const info=document.createElement("div");info.className="product-info";
  const name=document.createElement("h3");name.textContent=product.name;
  const offer=document.createElement("div");offer.className="offer";offer.textContent="🔥 PREÇO BAIXOU!";
  const platform=document.createElement("div");platform.className="platform";platform.textContent="🛍️ "+product.platform;
  const link=document.createElement("a");
  link.className="buy-button";link.href=product.link;link.target="_blank";link.rel="noopener noreferrer";link.textContent="🛒 COMPRE AQUI";
  info.append(name,offer,platform,link);
  if(isAdmin){
   const controls=document.createElement("div");controls.className="manage-buttons";
   const edit=document.createElement("button");edit.className="edit-button";edit.textContent="✏️ EDITAR";edit.onclick=()=>editProduct(product.id);
   const remove=document.createElement("button");remove.className="delete-button";remove.textContent="🗑️ EXCLUIR";remove.onclick=()=>deleteProduct(product.id);
   controls.append(edit,remove);info.appendChild(controls);
  }
  card.append(createGallery(product),info);
  container.appendChild(card);
 });
}

function editProduct(id){
 if(!isAdmin)return;
 const product=products.find(p=>p.id===id);
 if(!product)return;
 editingId=id;
 document.getElementById("productName").value=product.name;
 document.getElementById("productCategory").value=product.category;
 document.getElementById("productPlatform").value=product.platform;
 document.getElementById("productLink").value=product.link;
 selectedImages=(product.images||[]).map(url=>({url,file:null}));
 renderPreview();
 document.getElementById("formTitle").textContent="✏️ Editar Anúncio";
 document.getElementById("submitButton").textContent="💾 SALVAR ALTERAÇÕES";
 document.getElementById("cancelButton").style.display="block";
 document.getElementById("adminPanel").scrollIntoView({behavior:"smooth"});
}

async function deleteProduct(id){
 if(!isAdmin)return;
 const product=products.find(p=>p.id===id);
 if(!product||!confirm("Tem certeza que deseja excluir "+product.name+"?"))return;
 const {error}=await supabaseClient.from("products").delete().eq("id",id);
 if(error){alert("Erro ao excluir: "+error.message);return;}
 await loadProducts();
 if(editingId===id)resetForm();
 alert("Anúncio excluído!");
}

function resetForm(){
 editingId=null;selectedImages=[];
 document.getElementById("productName").value="";
 document.getElementById("productImage").value="";
 document.getElementById("productCategory").value="";
 document.getElementById("productPlatform").value="";
 document.getElementById("productLink").value="";
 renderPreview();
 document.getElementById("formTitle").textContent="➕ Cadastrar Produto";
 document.getElementById("submitButton").textContent="🚀 PUBLICAR PRODUTO";
 document.getElementById("cancelButton").style.display="none";
 document.getElementById("submitButton").disabled=false;
}
function cancelEdit(){resetForm();}

function openImageModal(image){
 document.getElementById("modalImage").src=image;
 document.getElementById("imageModal").style.display="flex";
}
function closeImageModal(){document.getElementById("imageModal").style.display="none";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeImageModal();});

function filterCategory(category){
 const filtered=products.filter(p=>p.category===category);
 document.getElementById("productsTitle").textContent="📂 "+category;
 renderProducts(filtered);
}
function showAllProducts(){
 document.getElementById("searchInput").value="";
 document.getElementById("productsTitle").textContent="🔥 Produtos e Ofertas";
 renderProducts();
}
function searchProducts(){
 const search=document.getElementById("searchInput").value.toLowerCase();
 const filtered=products.filter(p=>(p.name||"").toLowerCase().includes(search));
 document.getElementById("productsTitle").textContent=search?"🔎 Resultado da pesquisa":"🔥 Produtos e Ofertas";
 renderProducts(filtered);
}
async function shareStore(){
 const data={title:"GEESPORTESRUSTICO",text:"Confira as ofertas da nossa loja!",url:window.location.href};
 if(navigator.share){
  try{await navigator.share(data);}catch(e){}
 }else{
  try{await navigator.clipboard.writeText(window.location.href);alert("Link da loja copiado!");}
  catch(e){prompt("Copie o link da loja:",window.location.href);}
 }
}

checkSession();
loadProducts();
</script>

<script>
if("serviceWorker" in navigator){
 window.addEventListener("load",function(){
  navigator.serviceWorker.register("./service-worker.js")
  .then(registration=>console.log("Service Worker registrado:",registration.scope))
  .catch(error=>console.log("Erro ao registrar Service Worker:",error));
 });
}
</script>
</body>
</html>
